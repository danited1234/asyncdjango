# Install the hooks once per clone: pre-commit install
# Benchmark charts and results are generated (benchmarks/plot.py, run.py).
exclude: ^(docs/images/.*\.svg|benchmarks/results/.*\.json)$
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
