[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncdjango"
version = "0.1.0.dev0"
description = "A Django app that runs the async ORM and DRF-style views natively on the event loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.1",
    "psycopg>=3.2",
    "psycopg-pool>=3.2",
    "greenlet>=3.0",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.16,<3.17"]

[tool.setuptools]
# Upstream notices for code adapted from Django and DRF (docs/upstream.md).
license-files = ["licenses/*"]

[tool.setuptools.packages.find]
where = ["src"]
