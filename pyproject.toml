[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncdjango"
version = "0.1.0.dev0"
description = "A Django app that runs the async ORM and DRF-style views natively on the event loop"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
# LICENSE, plus upstream notices for code adapted from Django and DRF
# (docs/upstream.md).
license-files = ["LICENSE", "licenses/*"]
keywords = ["django", "asyncio", "orm", "postgresql", "psycopg", "djangorestframework", "adrf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "Django>=6.0,<6.1",
    "psycopg>=3.2",
    "psycopg-pool>=3.2",
    "greenlet>=3.0",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.16,<3.17"]
# Only for asyncdjango's own test suite (tests/test_channels.py).
test = ["channels>=4.2"]
# Only for benchmarks/ (the ADRF baseline and the charts).
bench = ["adrf==0.1.12", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/danited1234/asyncdjango"
Documentation = "https://github.com/danited1234/asyncdjango/blob/main/docs/guide.md"
Issues = "https://github.com/danited1234/asyncdjango/issues"
Changelog = "https://github.com/danited1234/asyncdjango/releases"

[tool.setuptools.packages.find]
where = ["src"]
