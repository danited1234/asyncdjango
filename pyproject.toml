[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncdjango"
version = "0.0.1"
description = "An experimental async-native Django-style framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["asyncpg>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]
