[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncdjango"
version = "0.1.0a1"
description = "A Django app that runs the async ORM and DRF-style views natively on the event loop"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
# LICENSE, plus upstream notices for code adapted from Django and DRF
# (docs/upstream.md).
license-files = ["LICENSE", "licenses/*"]
keywords = ["django", "asyncio", "orm", "postgresql", "psycopg", "djangorestframework", "adrf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "Django>=5.2,<6.1",
    "psycopg>=3.2",
    "psycopg-pool>=3.2",
    "greenlet>=3.0",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.16,<3.17"]
# asyncdjango.mail.EmailBackend.
mail = ["aiosmtplib>=3"]
# Only for asyncdjango's own test suite (Channels and a local SMTP server).
test = ["channels>=4.2", "aiosmtpd>=1.4"]
# Only for benchmarks/ (the ADRF baseline and the charts).
bench = ["adrf==0.1.12", "matplotlib>=3.8"]
# benchmarks/server.py (Linux, with wrk installed).
bench-server = ["adrf==0.1.12", "uvicorn[standard]>=0.38", "gunicorn>=23", "psutil>=6"]
# Linting and the git hooks (see README, "Development").
dev = ["pre-commit>=4", "ruff==0.14.2"]

[project.urls]
Homepage = "https://github.com/danited1234/asyncdjango"
Documentation = "https://github.com/danited1234/asyncdjango/blob/main/docs/guide.md"
Issues = "https://github.com/danited1234/asyncdjango/issues"
Changelog = "https://github.com/danited1234/asyncdjango/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations"]
# pre-commit passes file names explicitly; keep the excludes for those too.
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "ASYNC",        # blocking calls and other asyncio mistakes
    "RUF100",       # unused noqa
]
ignore = [
    "UP047",     # PEP 695 type parameters: TypeVar reads fine here
    "ASYNC109",  # open_pools(timeout=...) mirrors psycopg_pool's API
]

[tool.ruff.lint.per-file-ignores]
# Tests block the loop and touch lazy attributes on purpose.
"tests/**" = ["B018", "ASYNC110", "ASYNC251"]

[tool.ruff.lint.isort]
known-first-party = ["asyncdjango", "tests", "benchmarks"]
