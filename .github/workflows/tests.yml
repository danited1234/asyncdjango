name: tests

on:
  push:
    # Release tags run this suite through release.yml instead.
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Also run the Django stacks benchmark"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run pre-commit hooks
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pre-commit>=4"
          pre-commit run --all-files --show-diff-on-failure

  test:
    name: Python ${{ matrix.python }} / PostgreSQL ${{ matrix.postgres }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Django 6.0 supports Python 3.12-3.14 and PostgreSQL 14+.
        python: ["3.12", "3.13", "3.14"]
        postgres: ["14", "18"]
        django: ["6.0"]
        # Django 5.2 LTS at the ends of the range.
        include:
          - {python: "3.12", postgres: "14", django: "5.2"}
          - {python: "3.14", postgres: "18", django: "5.2"}

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asyncdjango
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The test runner creates and drops test_asyncdjango on this server.
      ASYNCDJANGO_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asyncdjango
      ASYNCDJANGO_REDIS_URL: redis://localhost:6379/0
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[drf,redis,test]" "psycopg[binary]" "Django~=${{ matrix.django }}.0"
          python -m pip list

      - name: Show PostgreSQL and libpq versions
        run: |
          python - <<'EOF'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/asyncdjango") as conn:
              print(conn.execute("select version()").fetchone()[0])
          print("psycopg", psycopg.__version__, psycopg.pq.__impl__, "libpq", psycopg.pq.version())
          EOF

      - name: System checks
        run: python -m django check --settings=tests.settings

      - name: Tests
        run: python -m django test tests --settings=tests.settings --noinput -v 2

  benchmark:
    name: Benchmark (Django, DRF, ADRF, asyncdjango)
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ASYNCDJANGO_BENCH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asyncdjango_bench
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[drf,bench]" "psycopg[binary]"

      - name: Run benchmark
        run: |
          python -m benchmarks.run --concurrency 25 50 | tee benchmark.txt
          python -m benchmarks.plot benchmarks/results/latest.json --out charts
          {
            echo "## Django stacks benchmark (GitHub-hosted runner)"
            echo
            sed -n '/^| scenario/,$p' benchmark.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: |
            benchmarks/results/latest.json
            charts/
